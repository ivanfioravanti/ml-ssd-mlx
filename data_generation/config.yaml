# Data Generation Configuration (paper-aligned defaults)

model:
  name: "mlx-community/Qwen3-4B-Instruct-2507-bf16"
  trust_remote_code: true

dataset:
  name: "microsoft/rStar-Coder"
  config: "seed_sft"
  split: "train"

# Paper §3.1: ~10K deduplicated prompts, one sample each (N=1).
# On public seed_sft: is_passed + unique question_id ≈ 10,168 prompts.
prompt_selection:
  mode: paper              # paper | full
  deduplicate_by: question_id
  filter_is_passed: true
  prefer_passed_row: true
  max_prompts: 0           # 0 = no cap; set 10000 to hard-cap at exactly 10K

output:
  path: "./output"

generation:
  temperature: 1.6         # Table 3, Qwen3-4B-Instruct T_train
  top_k: 20
  top_p: 0.8
  min_p: 0.0
  repetition_penalty: 1.0
  repetition_context_size: 20
  max_tokens: 65536
  stop:
    - "<|im_end|>"
    - "<|endoftext|>"
  loop_detection:
    ngram_min: 8
    ngram_max: 128
    repetitions: 4
    min_tokens: 4096
    check_interval: 512
    text_window_tokens: 4096
    text_ngram_min: 5
    text_ngram_max: 12
    text_repetitions: 50
    max_code_fences: 4

batch:
  completion_batch_size: 12
  prefill_batch_size: 12
  prefill_step_size: 2048
  max_kv_size:

checkpoint:
  every: 100                  # Save parquet checkpoints during long generation runs
  resume: false               # Set true or pass --resume to continue an interrupted run

mlx_distributed:
  enabled: false              # Set true only when launched with mlx.launch + JACCL hostfile
  backend: jaccl

post_process:
  filter_shortest_percent: 0      # Paper uses minimal syntactic filter only
  minimal_syntactic_filter: true  # Drop empty responses and single-line stubs
  stub_max_chars: 80
